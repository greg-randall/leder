article:
  path: "article.md"

corpus:
  root: "./"

output:
  dir: "."
  web_cache_dir: "web_cache/"

pricing:
  deepseek-v4-pro:  { input: 0.435, output: 0.87  }   # per 1M tokens
  deepseek-v4-flash: { input: 0.14,  output: 0.28  }
  deepseek-v4-pro[1m]: { input: 0.435, output: 0.87 }

stage_a:
  model: "deepseek-v4-pro"
  quality_gate: true

stage_b:
  model: "deepseek-v4-pro"
  concurrency: 32
  timeout: 600
  max_turns: 60

stage_c:
  quote_match_method: "normalized"

playbooks:
  dir: "pipelines/"
  active: ["fact_check"]

prepare:
  source_root: "source/"
  convert_workers: 8
  ocr_images: true
  vision_fallback:
    enabled: true
    model: "gpt-4o-mini"
    min_words: 20
    max_pages_per_doc: 30
  audio:
    enabled: true
    model: "medium"      # faster-whisper model size (tiny/base/small/medium/large-v3)
    device: "auto"       # auto = GPU if available else CPU (with a warning)
  summarize:
    model: "deepseek-v4-flash"
    workers: 50
  rollup:
    model: "deepseek-v4-pro"
    big_call_model: "deepseek-v4-pro[1m]"
    workers: 12
    crosscutting: true
