article:
  path: "article.md"

corpus:
  root: "corpus/"

output:
  dir: "."

pricing:
  deepseek-v4-pro:  { input: 0.435, output: 0.87  }   # per 1M tokens
  deepseek-v4-flash: { input: 0.14,  output: 0.28  }
  deepseek-v4-pro[1m]: { input: 0.435, output: 0.87 }

stage_a:
  model: "deepseek-v4-pro"
  quality_gate: true

stage_b:
  model: "deepseek-v4-pro"
  concurrency: 32
  timeout: 600
  max_turns: 60

stage_c:
  quote_match_method: "normalized"

playbooks:
  dir: "pipelines/"
  active: ["fact_check"]

prepare:
  source_root: "corpus/"
  convert_workers: 8
  ocr_images: true
  # Already-plain-text formats are copied through verbatim instead of being run
  # through the converter (so a CSV stays a CSV rather than becoming a giant
  # markdown pipe table). HTML/XML are intentionally NOT listed — their
  # converters genuinely improve them. Edit this list to change what's treated
  # as "already text".
  text_native_extensions:
    - .txt
    - .text
    - .csv
    - .tsv
    - .md
    - .markdown
    - .json
    - .jsonl
    - .ndjson
    - .yaml
    - .yml
    - .toml
    - .ini
    - .cfg
    - .log
    - .rst
    - .tex
    # source code
    - .py
    - .js
    - .mjs
    - .ts
    - .jsx
    - .tsx
    - .sql
    - .sh
    - .bash
    - .c
    - .h
    - .cpp
    - .hpp
    - .java
    - .go
    - .rs
    - .rb
    - .php
    - .r
    - .css
    - .scss
  vision_fallback:
    enabled: true
    model: "gpt-4o-mini"
    language: "en"        # for spellcheck-based garbled-text detection
    min_words: 20
    max_pages_per_doc: 30
    min_image_dim: 130    # skip OCR/vision on images <= this many pixels
    dedup_images: true     # skip perceptual duplicate images
  audio:
    enabled: true
    model: "medium"      # faster-whisper model size (tiny/base/small/medium/large-v3)
    device: "auto"       # auto = GPU if available else CPU (with a warning)
  summarize:
    model: "deepseek-v4-flash"
    workers: 50
  rollup:
    model: "deepseek-v4-pro"
    big_call_model: "deepseek-v4-pro[1m]"
    workers: 12
    crosscutting: true
