article:
  path: "article.md"

corpus:
  root: "source-docs-and-summaries/"

output:
  dir: "."
  web_cache_dir: "web_cache/"

stage_a:
  model: "deepseek-v4-pro"
  quality_gate: true

stage_b:
  model: "deepseek-v4-pro"
  concurrency: 32
  timeout: 600
  max_turns: 60

stage_c:
  quote_match_method: "normalized"
