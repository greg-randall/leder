name: "Fact Check"
description: "Extract verifiable factual claims and verify against source documents."

extraction:
  prompt: |
    Extract every verifiable factual claim from the article below.

    Article:
    ---
    {{article_text}}
    ---

  quality_gate:
    enabled: true
    prompt: |
      Existing extracted claims:
      {{existing_claims}}

      Article:
      ---
      {{article_text}}
      ---

      Identify any factual claims that were MISSED from the extraction above.
      A claim is NOT missed if any existing claim makes the same assertion in
      different words -- report only assertions with no semantic equivalent
      in the list.

verification:
  prompt: |
    ## Article Summary
    {{article_summary}}

    ## Claim to Verify
    {{target_text}}

    ## Article Context
    {{context}}

    ## EVALUATION

    Distinguish two questions:
    1. Attribution accuracy -- does the source confirm this was said/done as
       the article describes?
    2. Independent corroboration -- does any primary/official source confirm
       the underlying fact itself?

    Pick ONE severity:

    - PASS -- one of:
        (a) the article attributes a statement ("X testified that Y") and the
            source confirms X said Y. Note in agent_summary whether Y itself
            is corroborated, contested, or unverified by anything else in the
            corpus.
        (b) the source explicitly confirms the claim as a bare fact, and
            nothing contradicts it.
    - WARNING -- one of:
        (a) the article asserts a contested or testimony-only fact as bare
            fact (no attribution) -- recommended_action should suggest adding
            attribution, e.g. "add attribution: 'per testimony from X at the
            July 2026 meeting...'".
        (b) no source was found, or the source is ambiguous/silent.
    - CRITICAL -- the source contradicts the claim: a specific number, date,
      or count is wrong, or a speaker's self-correction the article missed.

    Set `metadata.attribution_status` to exactly one of:
    "attributed_and_confirmed", "stated_as_fact_testimony_only",
    "corroborated", "contradicted", "not_found".

    - agent_summary: 1-2 sentences. Be specific -- mention the actual source
      content. BAD: "A document was found that supports this." GOOD: "The
      July 14, 2026 meeting transcript quotes Jerry Carill saying the
      facility injects '20,000 barrels a day,' matching the claim."

    - source_excerpt: verbatim text from the source that confirms or
      contradicts the claim. This is the evidence the human reviewer checks.

    - recommended_action: a concrete edit instruction for the article's
      editor -- e.g. "change 'per week' to 'per day'", "add attribution: 'per
      testimony from...'", "soften to 'nearly every meeting'". Null when
      severity is PASS and no edit is needed. Never restate the finding;
      state the fix.

  allowed_tools: [Read, Bash, WebSearch, WebFetch]

display:
  template: |
    {{severity_badge}} **{{target_text}}**
    {{agent_summary}}
    {% if source_excerpt %}> "{{source_excerpt}}"{% endif %}
    {% if source_path %}[source]({{source_path}}){% endif %}
    {% if recommended_action %}-> {{recommended_action}}{% endif %}
